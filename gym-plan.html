<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="theme-color" content="#0A0A0A">
  <title>Training Plans</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0A0A0A; color: #DDD8CC; font-family: Georgia, serif; min-height: 100vh; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 60px); }
    .app { max-width: 680px; margin: 0 auto; }

    .header { padding: calc(env(safe-area-inset-top, 20px) + 24px) 22px 16px; border-bottom: 1px solid #1A1A1A; }
    .header-label { font-size: 9px; letter-spacing: 0.3em; color: #3A3A3A; font-family: monospace; margin-bottom: 8px; text-transform: uppercase; }
    .header h1 { font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
    .header-sub { font-size: 11px; color: #444; margin-top: 5px; font-family: monospace; }

    /* Plan selector */
    .plan-selector { display: flex; gap: 0; border-bottom: 1px solid #1A1A1A; position: sticky; top: 0; background: #0A0A0A; z-index: 100; }
    .plan-btn { flex: 1; padding: 12px 6px; background: none; border: none; border-bottom: 2px solid transparent; color: #333; font-size: 8px; letter-spacing: 0.15em; font-family: monospace; cursor: pointer; transition: all 0.2s; line-height: 1.4; text-align: center; }
    .plan-btn.active { border-bottom-color: var(--theme, #D4A843); color: var(--theme, #D4A843); }

    /* Day tabs */
    .day-tabs { display: flex; gap: 6px; padding: 16px 20px 0; }
    .day-tab { flex: 1; padding: 12px 6px; background: #111; border: 1px solid #1E1E1E; border-radius: 6px; color: #555; font-family: monospace; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .day-tab .day-sub { font-size: 8px; margin-top: 3px; opacity: 0.7; font-weight: 400; display: block; letter-spacing: 0.05em; }
    .day-tab.active { color: #0A0A0A; }

    /* Content */
    .content { padding: 18px 20px; }
    .day-label { font-size: 9px; letter-spacing: 0.2em; font-family: monospace; margin-bottom: 4px; }
    .day-note { font-size: 12px; color: #555; font-style: italic; margin-bottom: 16px; line-height: 1.6; }

    /* Exercise cards */
    .ex-card { background: #0F0F0F; border: 1px solid #161616; border-radius: 6px; padding: 13px 15px; margin-bottom: 5px; cursor: pointer; }
    .ex-card.open { background: #141414; border-color: #252525; }
    .ex-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .ex-name { font-size: 14px; color: #DDD8CC; }
    .ex-muscles { font-size: 10px; color: #3A3A3A; font-family: monospace; margin-top: 3px; }
    .ex-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
    .ex-sets { font-size: 12px; font-family: monospace; font-weight: 700; }
    .ex-rpe { font-size: 10px; color: #444; font-family: monospace; margin-top: 2px; }
    .ex-note { margin-top: 11px; padding-top: 11px; border-top: 1px solid #1A1A1A; font-size: 12px; color: #888; line-height: 1.7; font-style: italic; display: none; }
    .ex-card.open .ex-note { display: block; }

    /* Finisher */
    .finisher { background: #111; border: 1px solid #1A1A1A; border-left: 3px solid var(--theme, #D4A843); border-radius: 6px; padding: 14px 16px; margin-top: 12px; }
    .finisher-label { font-size: 9px; letter-spacing: 0.2em; font-family: monospace; margin-bottom: 8px; }
    .finisher-name { font-size: 14px; color: #DDD8CC; margin-bottom: 6px; }
    .finisher-desc { font-size: 12px; color: #777; line-height: 1.6; }

    .tap-hint { margin-top: 14px; font-size: 10px; color: #1E1E1E; text-align: center; font-family: monospace; letter-spacing: 0.1em; }

    /* Progress note */
    .progress-note { background: #0F0F0F; border: 1px solid #1A1A1A; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .progress-note p { font-size: 12px; color: #666; line-height: 1.7; font-style: italic; }
    .progress-note strong { color: #AAA; font-style: normal; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-label">Edgars · 188cm / 80kg · Recomposition</div>
    <h1>4-Day Training</h1>
    <div class="header-sub">Push / Pull / Legs / Full Body · Build muscle, stay lean</div>
  </div>

  <div class="plan-selector">
    <button class="plan-btn active" onclick="switchPlan('gym')">🏋<br>GYM</button>
    <button class="plan-btn" onclick="switchPlan('kb')">🪨<br>KB + BW</button>
    <button class="plan-btn" onclick="switchPlan('cal')">🌲<br>CALISTHENICS</button>
  </div>

  <div class="day-tabs" id="day-tabs"></div>
  <div class="content" id="content"></div>
</div>

          { name: 'Nordic Hamstring Curl', sets: '3', reps: '4–8', muscles: 'Hamstrings (eccentric)', rpe: 'RPE 9', note: 'Anchor feet under something, lower your body with straight back using hamstrings only. Extremely hard. One of the most effective hamstring exercises that exists — research backs this. Use hands to catch yourself at the bottom.' },
          { name: 'Single-Leg Calf Raise (slow)', sets: '4', reps: '15–20 each', muscles: 'Calves', rpe: 'RPE 7', note: '3s up, 3s down, 2s pause at bottom stretch. Tempo makes bodyweight challenging for calves.' },
          { name: 'Dragon Flag Progression', sets: '3', reps: '5–8', muscles: 'Full Core, Hip Flexors', rpe: 'RPE 9', note: 'Tuck → single leg extended → full dragon flag. One of the hardest core movements. Builds the visible abs and core control that carries over to every other movement.' },
        ],
      },
      {
        id: 'full', label: 'DAY 4', sub: 'FULL BODY', color: '#7EC87E',
        note: 'Skill + strength. Muscle-up progression anchors this day. Conditioning finisher at the end.',
        exercises: [
          { name: 'Muscle-Up Progression', sets: '4', reps: '3–5 or max', muscles: 'Full Upper Body', rpe: 'RPE 9', note: 'If you can\'t muscle-up: explosive pull-up trying to get chest to bar, then separate dip. The muscle-up is the ultimate upper body calisthenics movement. Worth training toward.' },
          { name: 'Handstand Push-Up Progression', sets: '3', reps: '5–8', muscles: 'Shoulders, Triceps', rpe: 'RPE 8–9', note: 'Pike push-up (feet elevated) → wall handstand push-up → freestanding. Progress wherever you are. The vertical press unlocks serious shoulder development.' },
          { name: 'One-Arm Push-Up Progression', sets: '3', reps: '5–6 each', muscles: 'Chest, Triceps (unilateral)', rpe: 'RPE 8', note: 'Archer push-up → elevated one-arm → full one-arm. Different stimulus from dips. Builds unilateral chest strength.' },
          { name: 'Weighted Pull-Up (heavy)', sets: '3', reps: '4–5', muscles: 'Lats, Biceps', rpe: 'RPE 9', note: 'Heaviest weight you can handle for clean reps. Strength focus — fewer reps than Day 2.' },
          { name: 'Pistol Squat (weighted)', sets: '3', reps: '5–6 each', muscles: 'Quads, Glutes', rpe: 'RPE 8', note: 'Hold a plate or wear a weighted vest. Second leg session — different emphasis from Day 3 volume.' },
        ],
        finisher: {
          name: '10-Min Calisthenics Flow Finisher',
          desc: '4 rounds: 10 explosive pull-ups → 10 dips → 15 jump squats → 10 push-ups → 30s rest. Move fast. This is where the conditioning work happens. By round 4 it should be a genuine fight to finish.'
        }
      },
    ],
  },
};

let currentPlan = 'gym';
let currentDayIdx = 0;
let openExIdx = null;

function switchPlan(plan) {
  currentPlan = plan;
  currentDayIdx = 0;
  openExIdx = null;
  document.querySelectorAll('.plan-btn').forEach((b, i) => {
    b.classList.toggle('active', ['gym','kb','cal'][i] === plan);
  });
  const theme = PLANS[plan].theme;
  document.documentElement.style.setProperty('--theme', theme);
  render();
}

function switchDay(idx) {
  currentDayIdx = idx;
  openExIdx = null;
  render();
}

function toggleEx(idx) {
  openExIdx = openExIdx === idx ? null : idx;
  renderContent();
}

function render() {
  renderDayTabs();
  renderContent();
}

function renderDayTabs() {
  const plan = PLANS[currentPlan];
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = plan.days.map((d, i) => `
    <button class="day-tab ${i === currentDayIdx ? 'active' : ''}"
      onclick="switchDay(${i})"
      style="${i === currentDayIdx ? `background:${d.color};border-color:${d.color}` : ''}">
      ${d.label}<span class="day-sub">${d.sub}</span>
    </button>
  `).join('');
}

function renderContent() {
  const plan = PLANS[currentPlan];
  const day = plan.days[currentDayIdx];
  const theme = day.color;

  let html = `
    <div class="progress-note"><p><strong>Progress rule:</strong> ${plan.progressNote}</p></div>
    <div class="day-label" style="color:${theme}">${day.label} — ${day.sub}</div>
    <div class="day-note">${day.note}</div>
  `;

  day.exercises.forEach((ex, i) => {
    const isOpen = openExIdx === i;
    html += `
      <div class="ex-card ${isOpen ? 'open' : ''}" onclick="toggleEx(${i})">
        <div class="ex-row">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscles">${ex.muscles}</div>
          </div>
          <div class="ex-right">
            <div class="ex-sets" style="color:${theme}">${ex.sets} × ${ex.reps}</div>
            <div class="ex-rpe">${ex.rpe}</div>
          </div>
        </div>
        <div class="ex-note">${ex.note}</div>
      </div>
    `;
  });

  if (day.finisher) {
    html += `
      <div class="finisher">
        <div class="finisher-label" style="color:${theme}">⚡ CONDITIONING FINISHER</div>
        <div class="finisher-name">${day.finisher.name}</div>
        <div class="finisher-desc">${day.finisher.desc}</div>
      </div>
    `;
  }

  html += `<div class="tap-hint">TAP EXERCISE FOR COACHING NOTES</div>`;
  document.getElementById('content').innerHTML = html;
}

// Init
document.documentElement.style.setProperty('--theme', PLANS[currentPlan].theme);
render();
</script>
</body>
</html>
